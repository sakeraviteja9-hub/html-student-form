<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table and span</title>
    <style>
        div{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            box-shadow: 0 0 10px;
             
        }
        table th,td{
            border: 2px solid;
        }
      
    </style>

</head>
<body>
    <div>
        <h1>
            <span style="color: brown;">R</span>
            <span style="color: rgb(56, 165, 42);">A</span>
            <span style="color: rgb(126, 42, 165);">V</span>
            <span style="color: rgb(165, 42, 83);">I</span>
        </h1>
        <h2>
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nihil laboriosam voluptatibus deserunt
    
        </h2>


    </div>
    <table>
        <tr>
            <th>sl.no</th>
            <th>name</th>
            <th>address</th>
        </tr>
        <tr>
            <td >1</td>
            <td>ravi</td>
            <td>lb</td>
        </tr>
        <tr>
            <td>2</td>
            <td>teja</td>
            <td>sr</td>
        </tr>
    </table>
    
</body>
</html>
